<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawker Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');
:root{
  --ink:#23261F; --jade:#0F6B57; --jadeDark:#0A4A3C; --chilli:#D8433A; --kaya:#E39A2D;
  --dusk:#46618F; --paper:#F4EFE4; --line:#E6DECE; --muted:#827C6E;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif; --mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:var(--paper);color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{display:flex;min-height:100vh}
.svg{display:inline-block;vertical-align:-2px}
/* sidebar */
.sidebar{width:240px;flex-shrink:0;padding:20px;display:flex;flex-direction:column;gap:24px;color:#fff;min-height:100vh;
  background-image:linear-gradient(180deg,rgba(8,40,33,.62),rgba(8,40,33,.28) 42%,rgba(8,40,33,.72)),url('wok_image.jpg');
  background-size:cover;background-position:center;}
.sidebar, .sidebar *{text-shadow:0 1px 5px rgba(0,0,0,.75)}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;border-radius:12px;background:var(--kaya);display:grid;place-items:center;color:var(--jadeDark);overflow:hidden}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand .name{font-family:var(--display);font-weight:800;font-size:15px}
.brand .sub{font-size:12px;color:#ffffffcc}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;color:#fff;font-size:16px;font-weight:600;text-align:left;width:100%}
.nav button.active{background:rgba(0,0,0,.42);font-weight:800}
.nav button .svg{opacity:.85}
.foot{margin-top:auto;font-size:12px;color:#ffffffaa}
/* main */
.main{flex:1;min-width:0}
.header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:10}
.header h1{font-family:var(--display);font-weight:800;font-size:20px;margin:0}
.hgroup{margin-left:auto;display:flex;align-items:center;gap:12px}
.clock{ text-align:right;line-height:1.1}
.clock .t{font-weight:700;font-size:14px}.clock .d{font-size:11px;color:var(--muted)}
.chip{display:flex;align-items:center;gap:5px;font-size:13px;padding:5px 9px;border-radius:9px;background:#fff;border:1px solid var(--line)}
.holchip{font-size:12px;color:var(--muted)}
.openbtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:9px;font-weight:700;font-size:13px;border:1px solid var(--jade);background:var(--jade);color:#fff}
.openbtn.closed{background:#fff;color:var(--muted);border-color:var(--line)}
.content{padding:20px}
/* mobile nav */
.mnav{display:none;gap:8px;padding:12px;overflow-x:auto;border-bottom:1px solid var(--line)}
.mnav button{white-space:nowrap;padding:8px 12px;border-radius:999px;font-size:14px;font-weight:600;background:#fff;border:1px solid var(--line)}
.mnav button.active{background:var(--jade);color:#fff;border-color:var(--jade)}
@media(max-width:820px){ .sidebar{display:none} .mnav{display:flex} }
/* cards & bits */
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{padding:14px}
.stat .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:8px}
.stat .lab{font-size:14px;font-weight:600;color:var(--ink)}
.stat .val{font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,36px);line-height:1.1}
.hero{border-radius:18px;padding:20px;background:var(--jadeDark);color:#fff;display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:20px}
.hero .greet{font-family:var(--display);font-weight:800;font-size:22px}
.hero .sub{font-size:14px;color:#ffffffb0}
.hero .dur{font-family:var(--mono);font-weight:700;font-size:26px;line-height:1.1}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:820px){.board,.grid3{grid-template-columns:1fr} .grid3{grid-template-columns:repeat(3,1fr)}}
.col{padding:12px}
.col h2{font-family:var(--display);font-weight:700;font-size:15px;margin:0}
.col .head{display:flex;align-items:center;gap:8px;padding:4px 4px 12px}
.dot{width:9px;height:9px;border-radius:50%}
.count{margin-left:auto;font-family:var(--mono);color:var(--muted);font-size:14px}
.flashing{animation:fb 1.3s ease}
@keyframes fb{0%{box-shadow:0 0 0 0 #E39A2D00}18%{box-shadow:0 0 0 4px #E39A2D}100%{box-shadow:0 0 0 0 #E39A2D00}}
.ticket{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;margin-bottom:12px;transition:transform .15s}
.ticket:hover{transform:translateY(-2px)}
.stub{display:grid;place-items:center;padding:10px 12px;border-right:2px dashed var(--line)}
.stub .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.stub .q{font-family:var(--mono);font-weight:700;font-size:26px;line-height:1}
.tbody{flex:1;min-width:0;padding:12px}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:6px}
.tag{padding:2px 6px;border-radius:5px;background:var(--paper);color:var(--ink);font-weight:600}
.items{list-style:none;margin:0 0 8px;padding:0;font-size:14px}
.items li{display:flex;gap:8px}.items .qx{font-family:var(--mono);color:var(--jade)}
.req{color:var(--chilli)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-family:var(--mono);font-weight:700}
.adv{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;color:#fff;font-weight:700;font-size:14px}
.subactions{display:flex;align-items:center;gap:12px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12px}
.subactions button{display:flex;align-items:center;gap:4px;font-weight:600}
.menugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.mitem{display:flex;gap:12px;padding:12px}
.mitem .thumb{width:60px;height:60px;border-radius:10px;background:var(--paper);display:grid;place-items:center;color:var(--muted);flex-shrink:0;overflow:hidden}
.mitem .thumb img{width:100%;height:100%;object-fit:cover}
.pill{font-size:12px;padding:4px 8px;border-radius:999px;font-weight:700}
.bar{height:7px;border-radius:999px;background:var(--paper);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--kaya)}
.daybars{display:flex;align-items:flex-end;gap:3px;height:180px;padding-top:8px}
.daybars .b{flex:1;background:var(--jade);border-radius:3px 3px 0 0;min-height:2px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.btn{padding:8px 12px;border-radius:9px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.btn.primary{background:var(--jade);color:#fff}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--muted);font-weight:600}
.banner{padding:12px 16px;border-radius:10px;font-size:14px;font-weight:600;margin-bottom:16px}
.empty{display:grid;place-items:center;text-align:center;padding:60px 16px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);background:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:50;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:60}
.modal .box{background:#fff;border-radius:18px;padding:20px;max-width:380px;width:100%}
.modal h2{font-family:var(--display);font-weight:800;font-size:18px;margin:0 0 6px}
.modal p{font-size:14px;color:var(--muted);margin:0 0 18px}
.modal .row{display:flex;gap:8px}
.modal .row button{flex:1;padding:10px;border-radius:9px;font-size:14px;font-weight:700}
.hint{font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;font-size:14px;font-weight:600;gap:4px}
.finp{padding:9px 11px;border:1px solid var(--line);border-radius:9px;font-family:var(--body);font-size:14px;background:var(--paper);font-weight:400}
.finp:focus{outline:2px solid var(--jade);background:#fff}
.monthpick{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
.monthpick button{padding:6px 12px;border-radius:999px;font-size:14px;font-weight:600;background:#fff;border:1px solid var(--line);white-space:nowrap}
.monthpick button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.sectiontitle{font-family:var(--display);font-weight:700;margin:0 0 12px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" id="brandLogo">🏪</div>
      <div><div class="name" id="brandName">Ah Hock Chicken Rice</div><div class="sub">Hawker dashboard</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Signed in as stall owner</div>
  </aside>
  <main class="main">
    <header class="header">
      <h1 id="title">Home</h1>
      <div class="hgroup">
        <div class="clock"><div class="t" id="clockT">—</div><div class="d" id="clockD"></div></div>
        <div class="chip" id="wx" title="Current weather in Singapore">🌡️ —</div>
        <div class="chip holchip" id="hol">—</div>
        <button class="openbtn" id="openBtn">⏻ <span>Open</span></button>
      </div>
    </header>
    <nav class="mnav" id="mnav"></nav>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<div id="modalHost"></div>

<script>
// ── config ──────────────────────────────────────────────────────
const API = "api/";
const STALL_ID = 1;                       // later: from the logged-in hawker
const POLL_MS = 5000;

const STATUS = {
  received:  {label:"Received",             next:"preparing", color:"var(--kaya)"},
  preparing: {label:"In the Kitchen",       next:"ready",     color:"var(--chilli)"},
  ready:     {label:"Ready for Collection", next:"collected", color:"var(--jade)"},
  collected: {label:"Collected",            next:null,        color:"var(--muted)"},
  cancelled: {label:"Cancelled",            next:null,        color:"var(--muted)"},
};
const BOARD = ["received","preparing","ready"];
const ADV_VERB = {received:"Start cooking", preparing:"Mark ready", ready:"Mark collected"};
const money = n => "$" + Number(n||0).toFixed(2);

const HOLIDAYS = [["2026-01-01","New Year's Day"],["2026-02-17","Chinese New Year"],["2026-02-18","Chinese New Year"],
["2026-03-20","Hari Raya Puasa*"],["2026-04-03","Good Friday"],["2026-05-01","Labour Day"],["2026-05-27","Hari Raya Haji*"],
["2026-05-31","Vesak Day"],["2026-06-01","Vesak Day (in lieu)"],["2026-08-09","National Day"],["2026-08-10","National Day (in lieu)"],
["2026-11-08","Deepavali"],["2026-11-09","Deepavali (in lieu)"],["2026-12-25","Christmas Day"]];

// ── tiny inline-SVG icons ───────────────────────────────────────
const IC = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  orders:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 11h6M9 15h4"/>',
  menu:'<path d="M4 5h16M4 12h16M4 19h10"/>',
  sales:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  settings:'<circle cx="5" cy="7" r="2"/><circle cx="14" cy="12" r="2"/><circle cx="8" cy="17" r="2"/><path d="M7 7h13M2 12h10M2 17h4M10 17h10"/>',
  contact:'<path d="M12 3l8 3v5c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/><path d="M12 9v4M12 16h.01"/>',
  printer:'<rect x="6" y="3" width="12" height="6"/><path d="M6 14H4a2 2 0 0 1-2-2V9h20v3a2 2 0 0 1-2 2h-2"/><rect x="6" y="13" width="12" height="8"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
};
function ic(name,size=18,color="currentColor"){return `<svg class="svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[name]||""}</svg>`;}

const NAV = [["home","Home","home"],["orders","Live orders","orders"],["menu","Menu","menu"],["sales","Sales report","sales"],
  ["past","Past orders","menu"],["settings","Settings","settings"],["contact","Contact admin","contact"]];

// ── state ───────────────────────────────────────────────────────
let tab = "home";
let isOpen = true;
let openedAt = (()=>{const d=new Date();d.setHours(7,30,0,0);return d;})();
let knownIds = null;        // Set of active order ids (null = first load)
let soundOn = true;
let pollTimer = null;
let audioCtx = null;

// ── helpers ─────────────────────────────────────────────────────
async function getJSON(path){ const r = await fetch(API+path); return r.json(); }
async function postJSON(path,body){ const r = await fetch(API+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); return r.json(); }
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function uploadPhoto(file){ const fd=new FormData(); fd.append("photo",file); const res=await fetch(API+"upload_image.php",{method:"POST",body:fd}); return res.json(); }
function wirePhoto(btnId,inputId,prevId,hiddenId){
  const btn=document.getElementById(btnId), input=document.getElementById(inputId);
  if(!btn||!input) return;
  btn.onclick=()=>input.click();
  input.onchange=async()=>{
    const file=input.files&&input.files[0]; if(!file) return;
    const prev=document.getElementById(prevId); const old=prev.innerHTML; prev.innerHTML="…";
    try{ const r=await uploadPhoto(file);
      if(r&&r.ok){ document.getElementById(hiddenId).value=r.url; prev.innerHTML=`<img src="${esc(r.url)}" alt="">`; toast("Photo uploaded"); }
      else { toast("Upload failed: "+((r&&r.error)||"error")); prev.innerHTML=old; }
    }catch(e){ toast("Upload failed"); prev.innerHTML=old; }
  };
}
const todaySG = () => new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit",timeZone:"Asia/Singapore"}).format(new Date());

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }

function ting(){
  if(!soundOn) return;
  try{ const Ctx=window.AudioContext||window.webkitAudioContext; audioCtx=audioCtx||new Ctx();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;
    o.type="sine"; o.frequency.setValueAtTime(1318,t); o.frequency.setValueAtTime(1760,t+0.09);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.42);
  }catch(e){}
}

function confirmDialog(title,body,confirmLabel,danger,onYes){
  const host=document.getElementById("modalHost");
  host.innerHTML=`<div class="modal"><div class="box"><h2>${esc(title)}</h2><p>${esc(body)}</p>
    <div class="row"><button id="mNo" style="border:1px solid var(--line);background:#fff;font-weight:600">Keep</button>
    <button id="mYes" style="background:${danger?'var(--chilli)':'var(--jade)'};color:#fff">${esc(confirmLabel)}</button></div></div></div>`;
  const close=()=>host.innerHTML="";
  host.querySelector(".modal").onclick=e=>{ if(e.target.classList.contains("modal")) close(); };
  host.querySelector("#mNo").onclick=close;
  host.querySelector("#mYes").onclick=()=>{ close(); onYes(); };
}

// ── header: clock / weather / holiday ───────────────────────────
function tickClock(){
  const now=new Date();
  document.getElementById("clockT").textContent=new Intl.DateTimeFormat("en-SG",{hour:"2-digit",minute:"2-digit",hour12:true,timeZone:"Asia/Singapore"}).format(now);
  document.getElementById("clockD").textContent=new Intl.DateTimeFormat("en-SG",{weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Singapore"}).format(now);
  const iso=todaySG();
  const hol=HOLIDAYS.find(h=>h[0]===iso), next=HOLIDAYS.find(h=>h[0]>=iso);
  const el=document.getElementById("hol");
  el.textContent = hol?hol[1] : next?("Next: "+next[1].replace(" (in lieu)","")+" · "+next[0].slice(8)+"/"+next[0].slice(5,7)) : "No holidays";
  el.style.color = hol?"var(--chilli)":"var(--muted)";
}
function loadWeather(){
  fetch("https://api.open-meteo.com/v1/forecast?latitude=1.29&longitude=103.85&current=temperature_2m,weather_code&timezone=Asia%2FSingapore")
    .then(r=>r.json()).then(d=>{ const c=d.current.weather_code, t=Math.round(d.current.temperature_2m);
      const e=c===0?"☀️":c<=3?"⛅":c<=48?"🌫️":c<=82?"🌧️":"⛈️";
      document.getElementById("wx").innerHTML=`${e} <b>${t}°</b>`;
    }).catch(()=>{});
}

// ── HOME ────────────────────────────────────────────────────────
async function renderHome(){
  const c=document.getElementById("content");
  c.innerHTML=`<div class="hint">Loading today…</div>`;
  let orders=[];
  try{ const d=await getJSON(`get_stall_orders.php?stall_id=${STALL_ID}&all=1`); if(d.ok) orders=d.orders; }catch(e){}
  const today=todaySG();
  const todays=orders.filter(o=>String(o.created_at).slice(0,10)===today);
  const revenue=todays.filter(o=>o.order_status!=="cancelled").reduce((s,o)=>s+Number(o.total_amount),0);
  const count=todays.length;
  const items=todays.reduce((s,o)=>s+(o.items||[]).reduce((a,i)=>a+Number(i.quantity),0),0);
  const completed=todays.filter(o=>o.order_status==="collected").length;
  const active=orders.filter(o=>BOARD.includes(o.order_status)).length;
  const now=new Date();
  const hr=Number(new Intl.DateTimeFormat("en-GB",{hour:"2-digit",hour12:false,timeZone:"Asia/Singapore"}).format(now));
  const greet=hr<12?"Good morning":hr<18?"Good afternoon":"Good evening";
  let dur="—"; if(isOpen){const ms=Math.max(0,now-openedAt);dur=Math.floor(ms/3.6e6)+"h "+Math.floor(ms%3.6e6/6e4)+"m";}
  const openedLabel=new Intl.DateTimeFormat("en-SG",{hour:"2-digit",minute:"2-digit",hour12:true}).format(openedAt);
  const stat=(ic_,lab,val,tone)=>`<div class="card stat"><div class="ic" style="background:${tone}1f">${ic(ic_,19,tone)}</div><div class="lab">${lab}</div><div class="val">${val}</div></div>`;
  c.innerHTML=`
    <div class="hero">
      <div><div class="greet">${greet}, ${esc(document.getElementById("brandName").textContent.split(" ")[0])}</div>
      <div class="sub">${new Intl.DateTimeFormat("en-SG",{weekday:"long",day:"numeric",month:"long",timeZone:"Asia/Singapore"}).format(now)}</div></div>
      <div style="margin-left:auto;text-align:right">
        <div style="font-size:14px;color:${isOpen?'#fff':'#ffd5d0'}">● ${isOpen?"Open":"Closed"}</div>
        <div class="dur">${isOpen?dur:"—"}</div>
        <div style="font-size:11px;color:#ffffff99">${isOpen?("open since "+openedLabel):"shop closed"}</div>
      </div>
    </div>
    <div class="grid3" style="margin-bottom:20px">
      ${stat("sales","Revenue today",money(revenue),"var(--jade)")}
      ${stat("orders","Orders today",count,"var(--kaya)")}
      ${stat("sales","Avg order",money(count?revenue/count:0),"var(--chilli)")}
      ${stat("menu","Items sold",items,"var(--dusk)")}
      ${stat("orders","In progress",active,"var(--kaya)")}
      ${stat("home","Completed",completed,"var(--jade)")}
    </div>
    <div class="card" style="padding:16px;font-size:14px">
      <span style="color:var(--muted)">Right now you have </span><b style="color:var(--jade)">${active} order${active!==1?"s":""} on the board</b>.
      ${count===0?'<span style="color:var(--muted)"> No orders logged today yet.</span>':''}
    </div>`;
}

// ── LIVE ORDERS ─────────────────────────────────────────────────
function ticketHTML(o){
  const s=STATUS[o.order_status]||STATUS.received;
  const raw=String(o.created_at);
  const time=raw.slice(11,16);
  const dlabel=(()=>{const d=new Date(raw.replace(' ','T'));return isNaN(d)?raw.slice(5,10):d.toLocaleDateString('en-SG',{day:'numeric',month:'short'});})();
  const items=(o.items||[]).map(i=>`<li><span class="qx">${Number(i.quantity)}×</span><span><b>${esc(i.item_name)}</b>${i.special_request?` <span class="req">· ${esc(i.special_request)}</span>`:""}</span></li>`).join("");
  return `<article class="ticket">

function renderOrders(orders){
  const c=document.getElementById("content");
  const toolbar=`<div class="toolbar">
    <button class="btn ghost" id="soundBtn">${soundOn?"🔔 Sound on":"🔕 Muted"}</button>
    <span class="hint" style="margin-left:auto">Auto-refreshing every ${POLL_MS/1000}s</span></div>`;
  const banner=!isOpen?`<div class="banner" style="background:#D8433A18;color:var(--chilli)">Stall is Closed — customers can't place new orders. Toggle Open up top to resume.</div>`:"";
  const cols=BOARD.map(st=>{
    const list=orders.filter(o=>o.order_status===st);
    const inner=list.length?list.map(ticketHTML).join(""):`<p style="text-align:center;color:var(--muted);font-size:14px;padding:24px 0">Nothing here right now.</p>`;
    return `<section class="card col" data-col="${st}"><div class="head"><span class="dot" style="background:${STATUS[st].color}"></span><h2>${STATUS[st].label}</h2><span class="count">${list.length}</span></div>${inner}</section>`;
  }).join("");
  c.innerHTML=toolbar+banner+`<div class="board">${cols}</div>`;
  document.getElementById("soundBtn").onclick=()=>{ soundOn=!soundOn; ting(); renderOrders(window._orders||[]); };
}
async function loadOrders(flashAllowed=true){
  let orders=[];
  try{ const d=await getJSON(`get_stall_orders.php?stall_id=${STALL_ID}`); if(!d.ok){ document.getElementById("content").innerHTML=`<div class="empty">Couldn't load orders: ${esc(d.error)}</div>`; return; } orders=d.orders; }
  catch(e){ document.getElementById("content").innerHTML=`<div class="empty">Couldn't reach the server. Is XAMPP running?</div>`; return; }
  window._orders=orders;
  const ids=new Set(orders.map(o=>o.order_id));
  let isNew=false;
  if(knownIds!==null && flashAllowed){ for(const id of ids){ if(!knownIds.has(id)){ isNew=true; break; } } }
  knownIds=ids;
  if(tab!=="orders") return;       // user navigated away mid-fetch
  renderOrders(orders);
  if(isNew){ ting(); const col=document.querySelector('[data-col="received"]'); if(col){ col.classList.add("flashing"); setTimeout(()=>col.classList.remove("flashing"),1300); } }
}
async function advance(id){
  const r=await postJSON("update_order_status.php",{order_id:id,action:"advance"});
  if(!r.ok) toast("Couldn't update: "+r.error); else toast("Order moved to "+(STATUS[r.status]?.label||r.status));
  loadOrders(false);
}
function askCancel(id,code,total){
  confirmDialog("Cancel & refund order?",`Order #${code} will be cancelled and the customer refunded ${money(total)}.`,"Cancel & refund",true,async()=>{
    const r=await postJSON("update_order_status.php",{order_id:id,status:"cancelled"});
    if(!r.ok) toast("Couldn't cancel: "+r.error); else toast(`Order #${code} cancelled & refunded`);
    loadOrders(false);
  });
}
function reprint(code){ toast(`Ticket #${code} sent to the printer`); }   // wires to the print agent later

    <button id="${sendId}" style="background:var(--jade);color:#fff">Send</button></div></div></div>`;
  const close=()=>host.innerHTML="";
  host.querySelector(".modal").onclick=e=>{ if(e.target.classList.contains("modal")) close(); };
  host.querySelector("#cmCancel").onclick=close;
  host.querySelector("#"+sendId).onclick=()=>onSend(close);
}
function openPaymentIssue(){
  contactModal("Raise a payment issue",
    `<label class="fld">Order code (customer's code)<input id="pCode" class="finp" placeholder="e.g. 2268"></label>
     <label class="fld">What happened (optional)<input id="pNote" class="finp" placeholder="Customer says PayNow paid, nothing received"></label>`,
    "pSend", async(close)=>{
      const code=document.getElementById("pCode").value.trim();
      const note=document.getElementById("pNote").value.trim();
      if(!code){ toast("Enter the order code"); return; }
      let order=null;
      try{ const d=await getJSON(`get_stall_orders.php?stall_id=${STALL_ID}&all=1`); if(d.ok) order=(d.orders||[]).find(o=>String(o.verification_code)===code); }catch(e){}
      if(!order){ toast(`No order found with code ${code}`); return; }
      let r; try{ r=await postJSON("report_payment_issue.php",{order_id:order.order_id,note:note}); }catch(e){ toast("Network error"); return; }
      if(!r||!r.ok){ toast("Couldn't send: "+((r&&r.error)||"error")); return; }
      close(); toast(r.message?`Already open (#${r.issue_id})`:`Payment issue raised (#${r.issue_id})`);
      if(tab==="contact") renderContact();
    });
}
function openOtherIssue(){
  contactModal("Report an issue",
    `<label class="fld">Subject<input id="oSubj" class="finp" placeholder="Short summary"></label>
     <label class="fld">Details<textarea id="oMsg" class="finp" rows="4" placeholder="Describe the issue"></textarea></label>`,
    "oSend", async(close)=>{
      const subject=document.getElementById("oSubj").value.trim();
      const message=document.getElementById("oMsg").value.trim();
      if(!subject){ toast("Enter a subject"); return; }
      let r; try{ r=await postJSON("report_other_issue.php",{stall_id:STALL_ID,subject,message}); }catch(e){ toast("Network error"); return; }
      if(!r||!r.ok){ toast("Couldn't send: "+((r&&r.error)||"error")); return; }
      close(); toast(`Sent to superadmin (#${r.ticket_id})`);
      if(tab==="contact") renderContact();
    });
}

// ── placeholder tabs ────────────────────────────────────────────
function renderPlaceholder(name,note){ document.getElementById("content").innerHTML=`<div class="empty"><div style="font-size:28px">🛠️</div><p style="margin-top:10px"><b>${name}</b><br>${note}</p></div>`; }

// ── router ──────────────────────────────────────────────────────
function setTab(t){
  tab=t;
  document.getElementById("title").textContent=NAV.find(n=>n[0]===t)[1];
  [...document.querySelectorAll("#nav button,#mnav button")].forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  clearInterval(pollTimer); pollTimer=null;
  if(t==="home") renderHome();
  else if(t==="orders"){ loadOrders(false); pollTimer=setInterval(()=>loadOrders(true),POLL_MS); }
  else if(t==="menu") renderMenu();
  else if(t==="sales") renderSales();
  else if(t==="past") renderPast();
  else if(t==="settings") renderSettings();
  else if(t==="contact") renderContact();
}

// ── boot ────────────────────────────────────────────────────────
function buildNav(){
  document.getElementById("nav").innerHTML=NAV.map(n=>`<button data-tab="${n[0]}">${ic(n[2],20)} ${n[1]}</button>`).join("");
  document.getElementById("mnav").innerHTML=NAV.map(n=>`<button data-tab="${n[0]}">${n[1]}</button>`).join("");
  [...document.querySelectorAll("#nav button,#mnav button")].forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
}
document.getElementById("openBtn").onclick=function(){
  isOpen=!isOpen; if(isOpen) openedAt=new Date();
  this.classList.toggle("closed",!isOpen);
  this.querySelector("span").textContent=isOpen?"Open":"Closed";
  if(tab==="home") renderHome(); if(tab==="orders") renderOrders(window._orders||[]);
};
buildNav(); tickClock(); setInterval(tickClock,1000); loadWeather(); loadStallBrand();
setTab("home");
</script>
