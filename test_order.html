<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Create order tester</title></head>
<body style="font-family:system-ui,Arial,sans-serif;max-width:560px;margin:40px auto;line-height:1.5">
  <h2>Create order &mdash; quick test</h2>
  <p>Sends a sample cart to <code>api/create_order.php</code> and shows the response.
     Click it a few times &mdash; watch <b>queue_number</b> go 1, 2, 3&hellip;</p>
  <button id="go" style="padding:10px 16px;font-size:16px;cursor:pointer">Place test order</button>
  <pre id="out" style="background:#f4f4f4;padding:12px;border-radius:8px;white-space:pre-wrap"></pre>
  <script>
    const sampleCart = {
      user_id: 1,
      stall_id: 1,
      order_type: "takeaway",
      items: [
        { item_id: 1, quantity: 2, special_request: "no chilli" },
        { item_id: 2, quantity: 1, special_request: "" }
      ]
    };
    document.getElementById('go').onclick = async () => {
      const out = document.getElementById('out');
      out.textContent = 'Sending...';
      try {
        const res = await fetch('api/create_order.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(sampleCart)
        });
        out.textContent = JSON.stringify(await res.json(), null, 2);
      } catch (e) {
        out.textContent = 'Error: ' + e.message;
      }
    };
  </script>
</body>
</html>
